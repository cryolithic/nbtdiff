name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    name: Build and test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore
      - run: dotnet build -c Release --no-restore
      - run: dotnet test -c Release --no-build --logger "trx;LogFileName=results.trx"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.os }}
          path: "**/TestResults/*.trx"

  # Binaries only for master, v* tags and manual runs; other branches and PRs just build and test.
  # All variants cross-publish from Linux (no AOT), which is cheaper than Windows. "standalone"
  # bundles the .NET runtime; "dotnet" needs the .NET 10 runtime installed but is half the size.
  publish:
    name: Publish ${{ matrix.rid }} (${{ matrix.flavor }})
    needs: build
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.ref == 'refs/heads/master' ||
      startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        rid: [win-x64, linux-x64]
        flavor: [standalone, dotnet]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Publish
        run: |
          args="-p:PublishProfile=${{ matrix.rid }}"
          if [ "${{ matrix.flavor }}" = standalone ]; then args="$args -p:SelfContained=true"; fi
          case "$GITHUB_REF" in refs/tags/v*) args="$args -p:Version=${GITHUB_REF_NAME#v}" ;; esac
          dotnet publish src/NbtDiff.App $args
      - uses: actions/upload-artifact@v4
        with:
          name: nbtdiff-${{ matrix.rid }}-${{ matrix.flavor }}
          path: publish/${{ matrix.flavor == 'standalone' && format('{0}-standalone', matrix.rid) || matrix.rid }}/
          if-no-files-found: error

  release:
    name: GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: nbtdiff-*
      - name: Package
        # Standalone archives carry the plain name (what most people should download); the
        # smaller runtime-dependent ones say so in the file name.
        run: |
          v="$GITHUB_REF_NAME"
          (cd nbtdiff-win-x64-standalone && zip -r "../nbtdiff-$v-win-x64.zip" .)
          (cd nbtdiff-win-x64-dotnet && zip -r "../nbtdiff-$v-win-x64-needs-dotnet10.zip" .)
          chmod +x nbtdiff-linux-x64-standalone/nbtdiff nbtdiff-linux-x64-dotnet/nbtdiff
          tar -czf "nbtdiff-$v-linux-x64.tar.gz" -C nbtdiff-linux-x64-standalone .
          tar -czf "nbtdiff-$v-linux-x64-needs-dotnet10.tar.gz" -C nbtdiff-linux-x64-dotnet .
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --generate-notes
          $( [[ "$GITHUB_REF_NAME" == v0.* ]] && echo --prerelease )
          nbtdiff-*.zip nbtdiff-*.tar.gz
