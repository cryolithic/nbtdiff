name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    name: Build and test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore
      - run: dotnet build -c Release --no-restore
      - run: dotnet test -c Release --no-build --logger "trx;LogFileName=results.trx"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.os }}
          path: "**/TestResults/*.trx"

  # Binaries only for master, v* tags and manual runs; other branches and PRs just build and test.
  # Both RIDs cross-publish from Linux (framework-dependent, no AOT), which is cheaper than Windows.
  publish:
    name: Publish ${{ matrix.rid }}
    needs: build
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.ref == 'refs/heads/master' ||
      startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        rid: [win-x64, linux-x64]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet publish src/NbtDiff.App -p:PublishProfile=${{ matrix.rid }}
      - uses: actions/upload-artifact@v4
        with:
          name: nbtdiff-${{ matrix.rid }}
          path: publish/${{ matrix.rid }}/
          if-no-files-found: error

  release:
    name: GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: nbtdiff-*
      - name: Package
        run: |
          (cd nbtdiff-win-x64 && zip -r "../nbtdiff-win-x64-${GITHUB_REF_NAME}.zip" .)
          chmod +x nbtdiff-linux-x64/nbtdiff
          tar -czf "nbtdiff-linux-x64-${GITHUB_REF_NAME}.tar.gz" -C nbtdiff-linux-x64 .
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --generate-notes
          "nbtdiff-win-x64-${GITHUB_REF_NAME}.zip" "nbtdiff-linux-x64-${GITHUB_REF_NAME}.tar.gz"
